name: Deploy to GitHub Pages

on:
  # Runs when main changes, and can be started by hand from the Actions tab.
  push:
    branches: [main]
  workflow_dispatch:

# Lets this job read the repository and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        # Runs "npm run build", which includes the content and confidentiality checks.
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
